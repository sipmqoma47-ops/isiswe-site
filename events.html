<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Events | Isizwe Print</title>
  <meta name="description" content="Event printing — wristbands and tickets." />
  <style>
    :root{--bg:#F6F8FB;--panel:#fff;--line:#E5EAF2;--text:#0F172A;--muted:#64748B;--accent:#0D9488;}
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
    a{color:inherit;text-decoration:none}
    header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line)}
    .wrap{max-width:1100px;margin:0 auto;padding:14px 16px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand{display:flex;align-items:center;gap:10px}
    .logo{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);object-fit:cover;background:#fff}
    nav{display:flex;gap:10px;flex-wrap:wrap}
    nav a{padding:8px 12px;border-radius:10px;font-weight:800}
    nav a:hover{background:#EEF2F7}
    h1{margin:16px 0 6px;font-size:22px;font-weight:950}
    .sub{margin:0 0 14px;color:var(--muted)}
    .card{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:14px}
    ul{margin:10px 0 0;padding-left:18px}
    li{margin:8px 0}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
    .btn{background:var(--accent);color:#fff;padding:10px 14px;border-radius:12px;font-weight:900;display:inline-block}
  </style>
</head>
<body>
  <header>
    <div class="wrap topbar">
      <div class="brand">
        <img class="logo" src="/assets/logo.png" alt="Isizwe Print logo">
        <div>
          <div style="font-weight:900">Isizwe Print</div>
          <div style="font-size:12px;color:var(--muted)">Events</div>
        </div>
      </div>
      <nav>
        <a href="/about.html">About Us</a>
        <a href="/gallery.html">Gallery</a>
        <a href="https://wa.me/27730708651?text=Hi%20Isizwe%20Print%2C%20I%20need%20Event%20printing." target="_blank" rel="noreferrer">Contact</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <h1>Events</h1>
    <p class="sub">Everything you need for clean event control.</p>

    <div class="card">
      <strong>Products</strong>
      <ul>
        <li>Wristbands</li>
        <li>Event Tickets</li>
      </ul>

      <div class="actions">
        <a class="btn" href="https://wa.me/27730708651?text=Hi%20Isizwe%20Print%2C%20please%20quote%20me%20for%20Wristbands%20and%20Event%20Tickets." target="_blank" rel="noreferrer">WhatsApp for Quote</a>
        <a class="btn" style="background:#111827" href="/index.html">Back to Home</a>
      </div>
    </div>
  </main>
</body>
</html>
